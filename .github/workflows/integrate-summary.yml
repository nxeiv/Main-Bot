name: Integrate channel summary

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate summary handler
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.js')
          text = path.read_text(encoding='utf-8')

          if "const summary = require('./summary');" not in text:
              anchor = "const ai = require('./ai');\n"
              if anchor not in text:
                  raise SystemExit('Could not find AI import anchor in index.js')
              text = text.replace(
                  anchor,
                  anchor + "const summary = require('./summary');\n",
                  1,
              )

          marker = "    // ========================================================\n    // NORMAL AI\n    // ========================================================\n"
          block = """    // ========================================================
    // CHANNEL SUMMARY
    // ========================================================

    if (/^\\s*(?:can\\s+you\\s+)?summar(?:y|ize|ise)\\s+/i.test(question)) {
      const handled = await summary.handleMention({
        message,
        question,
        client,
        ai,
      });

      if (handled) {
        return;
      }
    }

"""

          if "summary.handleMention({" not in text:
              if marker not in text:
                  raise SystemExit('Could not find normal AI anchor in index.js')
              text = text.replace(marker, block + marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Summary integration already present."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "Add Discord channel summary integration"
          git push
