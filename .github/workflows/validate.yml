name: Validate Main Bot

on:
  push:
    branches:
      - main
  pull_request:

# CI only validates source and does not need write permissions.
permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Validate JavaScript syntax
        run: |
          node --check index.js
          node --check ai.js
          node --check commands.js
          node --check message-routing.js
          node --check status-server.js
          node --check afk-store.js
          node --check ai-knowledge.js
          node --check shutdown.js
          node --check minecraft.js
          node --check summary.js
          node --check unicode.js
          node --check config.js
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run unit tests
        run: npm test
