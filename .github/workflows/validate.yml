name: Validate Main Bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Validate JavaScript syntax
        run: |
          node --check index.js
          node --check ai.js
          node --check commands.js
          node --check message-routing.js
          node --check minecraft.js
          node --check summary.js
          node --check unicode.js
          node --check config.js
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run unit tests
        run: npm test
